name: Atualizar Portfólio & Mapa Mental

on:
  # 1. Agendamento automático diário (06:00 UTC)
  schedule:
    - cron: '0 6 * * *'

  # 2. Execução manual pela interface do GitHub (Actions -> Run workflow)
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Nome do repositório específico (ou vazio para modo incremental)'
        required: false
        default: ''

  # 3. Notificação externa disparada por push em outros repositórios
  repository_dispatch:
    types: [repo_updated]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-portfolio-map
  cancel-in-progress: false

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório Portifólio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Executar Atualização Incremental
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.event.client_payload.repo || github.event.inputs.target_repo }}
        run: |
          node scripts/update_incremental.js

      - name: Commit e Push das alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detectada para commit."
          else
            git commit -m "chore(auto): atualização incremental do portfólio [skip ci]"
            git pull --rebase origin main
            git push origin HEAD
          fi

      # Opcional: Se o GitHub Pages estiver configurado como "GitHub Actions" nas configurações do repositório
      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
        continue-on-error: true

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
